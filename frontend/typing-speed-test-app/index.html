<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Speed Test</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>⌨️ Typing Speed Test</h1>
      <p>Measure your typing speed & accuracy.</p>
    </header>

    <section class="stats" aria-label="Stats">
      <div class="stat"><span class="stat__label">Time</span><span id="time" class="stat__value">30</span></div>
      <div class="stat"><span class="stat__label">WPM</span><span id="wpm" class="stat__value">0</span></div>
      <div class="stat"><span class="stat__label">Accuracy</span><span id="accuracy" class="stat__value">100%</span></div>
      <div class="stat"><span class="stat__label">Errors</span><span id="errors" class="stat__value">0</span></div>
    </section>

    <section class="controls">
      <label for="duration">Duration:</label>
      <select id="duration">
        <option value="15">15s</option>
        <option value="30" selected>30s</option>
        <option value="60">60s</option>
      </select>
      <button id="restart" type="button">Restart</button>
    </section>

    <section id="text-display" class="text-display" aria-live="polite"></section>

    <textarea id="input" class="input" placeholder="Start typing here..." autocomplete="off" spellcheck="false"></textarea>
  </main>

  <script src="script.js"></script>
</body>
</html>
