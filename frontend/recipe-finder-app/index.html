<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Finder — Discover Delicious Meals</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header__inner">
      <h1 class="header__logo">🍳 <span>Recipe Finder</span></h1>
      <nav class="header__nav">
        <button id="btn-random" class="btn btn--accent" title="Get a random recipe">🎲 Surprise Me</button>
      </nav>
    </div>
  </header>

  <!-- Hero / Search -->
  <section class="hero">
    <div class="container">
      <h2 class="hero__title">What would you like to cook today?</h2>
      <div class="search-bar">
        <input
          type="text"
          id="search-input"
          class="search-bar__input"
          placeholder="Search for a meal…"
          autocomplete="off"
        />
        <button id="btn-search" class="btn btn--primary">Search</button>
      </div>
      <!-- Category Pills -->
      <div id="categories" class="categories"></div>
    </div>
  </section>

  <!-- Results Grid -->
  <main class="container">
    <div id="results" class="grid"></div>
    <p id="no-results" class="no-results" hidden>No recipes found. Try a different search!</p>
    <div id="loader" class="loader" hidden>
      <span class="loader__spinner"></span>
    </div>
  </main>

  <!-- Recipe Detail Modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__content">
      <button id="modal-close" class="modal__close">&times;</button>
      <div id="modal-body" class="modal__body"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Mahmoud Magdy — Built with TypeScript &amp; TheMealDB API</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
