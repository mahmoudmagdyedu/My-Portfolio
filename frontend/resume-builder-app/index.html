<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResumeForge — منشئ سيرة ذاتية</title>
  <meta name="description" content="منشئ سيرة ذاتية احترافي مع معاينة لحظية وتصدير PDF" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-cairo">

  <header class="bg-gradient-to-r from-indigo-700 to-purple-700 text-white py-4 px-4 sm:px-8 flex items-center justify-between sticky top-0 z-20 shadow no-print">
    <div class="flex items-center gap-2">
      <span class="text-2xl">📝</span>
      <h1 class="font-black text-lg sm:text-xl">ResumeForge</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="darkToggle" type="button" class="bg-white/15 hover:bg-white/25 transition text-xs sm:text-sm font-bold px-3 py-2 rounded-full">🌙 داكن</button>
      <button id="resetBtn" type="button" class="bg-white/15 hover:bg-white/25 transition text-xs sm:text-sm font-bold px-3 py-2 rounded-full">🔄 إعادة</button>
      <button id="printBtn" type="button" class="bg-white text-indigo-700 hover:bg-indigo-50 transition text-xs sm:text-sm font-bold px-4 py-2 rounded-full shadow">⬇️ PDF</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-3 sm:p-6 grid grid-cols-1 lg:grid-cols-2 gap-5 sm:gap-6">

    <section class="no-print bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-5 sm:p-7 space-y-5">
      <h2 class="text-lg sm:text-xl font-black text-indigo-700 dark:text-indigo-300">بيانات السيرة الذاتية</h2>

      <fieldset class="space-y-3">
        <legend class="font-bold text-sm text-slate-600 dark:text-slate-300 mb-1">المعلومات الشخصية</legend>
        <input type="text" id="fullName" placeholder="الاسم الكامل" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 px-4 py-2.5" />
        <input type="text" id="jobTitle" placeholder="المسمى الوظيفي" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 px-4 py-2.5" />
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input type="email" id="email" placeholder="البريد الإلكتروني" class="rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 px-4 py-2.5" />
          <input type="tel" id="phone" placeholder="رقم الهاتف" dir="ltr" class="rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 px-4 py-2.5 text-right" />
        </div>
        <input type="text" id="location" placeholder="المدينة، الدولة" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 px-4 py-2.5" />
        <input type="text" id="website" placeholder="رابط (LinkedIn / GitHub / موقع شخصي)" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 px-4 py-2.5" />
      </fieldset>

      <fieldset>
        <legend class="font-bold text-sm text-slate-600 dark:text-slate-300 mb-1">الملخّص الشخصي</legend>
        <textarea id="summary" rows="4" placeholder="نبذة قصيرة عنك وعن خبرتك..." class="w-full rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 px-4 py-2.5"></textarea>
      </fieldset>

      <fieldset>
        <legend class="font-bold text-sm text-slate-600 dark:text-slate-300 mb-1">الخبرات (سطر لكل خبرة)</legend>
        <textarea id="experience" rows="5" placeholder="مطوّر واجهات | شركة س | 2023 - الآن&#10;مطوّر متدرّب | شركة ص | 2022 - 2023" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 px-4 py-2.5"></textarea>
      </fieldset>

      <fieldset>
        <legend class="font-bold text-sm text-slate-600 dark:text-slate-300 mb-1">التعليم (سطر لكل شهادة)</legend>
        <textarea id="education" rows="3" placeholder="بكالوريوس علوم الحاسب | جامعة س | 2019 - 2023" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 px-4 py-2.5"></textarea>
      </fieldset>

      <fieldset>
        <legend class="font-bold text-sm text-slate-600 dark:text-slate-300 mb-1">المهارات (افصل بفاصلة)</legend>
        <input type="text" id="skills" placeholder="HTML, CSS, JavaScript, Angular, .NET, SQL" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 px-4 py-2.5" />
      </fieldset>

      <p class="text-xs text-slate-500 dark:text-slate-400">💾 يتم الحفظ تلقائياً في متصفحك.</p>
    </section>

    <section id="preview" class="bg-white text-slate-800 rounded-2xl shadow-md border border-slate-200 p-6 sm:p-10 print-page">
      <div class="border-b-2 border-indigo-600 pb-4 mb-4">
        <h2 id="pvName" class="text-2xl sm:text-3xl font-black text-slate-900">اسمك الكامل</h2>
        <p id="pvJob" class="text-indigo-700 font-bold mt-1">المسمى الوظيفي</p>
        <p id="pvContact" class="text-sm text-slate-600 mt-2"></p>
      </div>

      <div class="mb-5">
        <h3 class="text-base font-black text-indigo-700 uppercase tracking-wide mb-2">الملخّص</h3>
        <p id="pvSummary" class="text-sm leading-relaxed text-slate-700">نبذة عنك ستظهر هنا...</p>
      </div>

      <div class="mb-5">
        <h3 class="text-base font-black text-indigo-700 uppercase tracking-wide mb-2">الخبرات</h3>
        <ul id="pvExperience" class="text-sm space-y-1 list-disc pr-5 text-slate-700"></ul>
      </div>

      <div class="mb-5">
        <h3 class="text-base font-black text-indigo-700 uppercase tracking-wide mb-2">التعليم</h3>
        <ul id="pvEducation" class="text-sm space-y-1 list-disc pr-5 text-slate-700"></ul>
      </div>

      <div>
        <h3 class="text-base font-black text-indigo-700 uppercase tracking-wide mb-2">المهارات</h3>
        <div id="pvSkills" class="flex flex-wrap gap-1.5"></div>
      </div>
    </section>

  </main>

  <script>
    const STORAGE_KEY = 'resume-forge-data-v1';
    const fields = ['fullName','jobTitle','email','phone','location','website','summary','experience','education','skills'];
    const SAMPLE = {
      fullName: 'محمود مجدي',
      jobTitle: 'Full Stack Developer',
      email: 'mahmoudmagdy@mail.com',
      phone: '+201228086441',
      location: 'الإسكندرية، مصر',
      website: 'github.com/mahmoudmagdyedu',
      summary: 'مطوّر Full Stack شغوف بتقنيات الويب الحديثة، أجمع بين الواجهات الأمامية والخلفية لبناء تطبيقات متكاملة وعالية الأداء.',
      experience: 'مطوّر Full Stack | مشاريع شخصية | 2024 - الآن\nمتدرّب تطوير ويب | تدريب ذاتي | 2023 - 2024',
      education: 'ليسانس الحقوق | جامعة الإسكندرية | 2019 - 2023',
      skills: 'HTML, CSS, JavaScript, TypeScript, Angular, .NET, C#, SQL, Git'
    };

    function loadData() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || SAMPLE; }
      catch (e) { return SAMPLE; }
    }
    function saveData() {
      const data = {};
      fields.forEach(f => data[f] = document.getElementById(f).value);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
    function setValues(data) {
      fields.forEach(f => { document.getElementById(f).value = data[f] || ''; });
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function renderPreview() {
      const v = id => document.getElementById(id).value.trim();
      document.getElementById('pvName').textContent = v('fullName') || 'اسمك الكامل';
      document.getElementById('pvJob').textContent = v('jobTitle') || 'المسمى الوظيفي';
      const contact = [v('email'), v('phone'), v('location'), v('website')].filter(Boolean).join(' • ');
      document.getElementById('pvContact').textContent = contact;
      document.getElementById('pvSummary').textContent = v('summary') || 'نبذة عنك ستظهر هنا...';

      const expLines = v('experience').split('\n').filter(Boolean);
      document.getElementById('pvExperience').innerHTML = expLines.length
        ? expLines.map(l => '<li>' + escapeHtml(l) + '</li>').join('')
        : '<li class="text-slate-400">سيظهر هنا سجل خبراتك</li>';

      const eduLines = v('education').split('\n').filter(Boolean);
      document.getElementById('pvEducation').innerHTML = eduLines.length
        ? eduLines.map(l => '<li>' + escapeHtml(l) + '</li>').join('')
        : '<li class="text-slate-400">سيظهر هنا تعليمك</li>';

      const skills = v('skills').split(',').map(s => s.trim()).filter(Boolean);
      document.getElementById('pvSkills').innerHTML = skills.length
        ? skills.map(s => '<span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-1 rounded-full">' + escapeHtml(s) + '</span>').join('')
        : '<span class="text-slate-400 text-sm">سيظهر هنا قائمة مهاراتك</span>';
    }

    setValues(loadData());
    renderPreview();
    fields.forEach(f => {
      document.getElementById(f).addEventListener('input', () => { saveData(); renderPreview(); });
    });

    document.getElementById('printBtn').addEventListener('click', () => window.print());
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!confirm('سيتم استبدال جميع البيانات ببيانات تجريبية. متابعة؟')) return;
      setValues(SAMPLE); saveData(); renderPreview();
    });

    const darkBtn = document.getElementById('darkToggle');
    function syncDarkLabel() {
      const isDark = document.documentElement.classList.contains('dark');
      darkBtn.textContent = isDark ? '☀️ فاتح' : '🌙 داكن';
    }
    syncDarkLabel();
    darkBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      syncDarkLabel();
    });
  </script>
</body>
</html>
