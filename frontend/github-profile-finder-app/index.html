<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHubLens | باحث ملفات GitHub</title>
  <meta name="description" content="GitHubLens — تطبيق بحث عن مستخدمي GitHub وعرض إحصاءاتهم وأهم مستودعاتهم." />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { darkMode: 'class' };
    if (localStorage.getItem('ghlens-theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
</head>
<body class="font-cairo bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors min-h-screen">

  <header class="bg-gradient-to-br from-slate-900 via-indigo-900 to-purple-900 text-white">
    <div class="max-w-4xl mx-auto px-4 py-10 sm:py-14">
      <div class="flex justify-between items-start mb-8">
        <a href="/" class="text-sm bg-white/10 hover:bg-white/20 backdrop-blur px-4 py-2 rounded-full border border-white/20 transition">← العودة للرئيسية</a>
        <button id="themeToggle" class="text-sm bg-white/10 hover:bg-white/20 backdrop-blur px-4 py-2 rounded-full border border-white/20 transition" aria-label="تبديل الوضع">🌙 الوضع الداكن</button>
      </div>
      <div class="text-center">
        <div class="text-5xl sm:text-6xl mb-3">🔎</div>
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-black mb-3">GitHubLens</h1>
        <p class="text-indigo-200 text-base sm:text-lg max-w-xl mx-auto">ابحث عن أي مستخدم GitHub وشاهد ملفه الشخصي وأهم مستودعاته في لمحة واحدة.</p>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 sm:py-12 space-y-6">

    <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-5 sm:p-7">
      <form id="searchForm" class="flex flex-col sm:flex-row gap-3">
        <input id="usernameInput" type="text" placeholder="اكتب اسم مستخدم GitHub، مثل: mahmoudmagdyedu" autocomplete="off" required minlength="1" class="flex-1 px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" dir="ltr" />
        <button type="submit" class="bg-gradient-to-l from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition">🔍 بحث</button>
      </form>
    </section>

    <section id="statusBox" class="hidden bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 text-center"></section>

    <section id="profileCard" class="hidden bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-5 sm:p-7">
      <div class="flex flex-col sm:flex-row gap-5 items-center sm:items-start">
        <img id="profileAvatar" src="" alt="" class="w-28 h-28 sm:w-32 sm:h-32 rounded-full ring-4 ring-indigo-500/30 object-cover shrink-0" />
        <div class="flex-1 text-center sm:text-right">
          <h2 id="profileName" class="text-2xl font-black text-slate-800 dark:text-white"></h2>
          <a id="profileLogin" href="#" target="_blank" rel="noopener noreferrer" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline" dir="ltr"></a>
          <p id="profileBio" class="text-slate-600 dark:text-slate-300 mt-2 leading-relaxed"></p>
          <div id="profileMeta" class="flex flex-wrap gap-2 mt-3 justify-center sm:justify-start text-xs"></div>
        </div>
      </div>
      <div id="profileStats" class="grid grid-cols-3 gap-3 mt-6"></div>
    </section>

    <section id="reposSection" class="hidden bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-5 sm:p-7">
      <h3 class="text-xl font-black text-indigo-700 dark:text-indigo-400 mb-4 flex items-center gap-2"><span class="w-1.5 h-7 bg-indigo-500 rounded-full inline-block"></span>أهم المستودعات</h3>
      <div id="reposList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </section>

  </main>

  <footer class="text-center text-slate-500 dark:text-slate-400 text-xs py-6">
    <p>صُنع بواسطة <a href="https://github.com/mahmoudmagdyedu" class="text-indigo-600 dark:text-indigo-400 hover:underline" target="_blank" rel="noopener">@mahmoudmagdyedu</a> — جزء من <strong>My-Portfolio</strong></p>
  </footer>

  <script>
    // ======== GitHubLens — App Logic (TypeScript-inspired) ========
    const els = {
      form: document.getElementById('searchForm'),
      input: document.getElementById('usernameInput'),
      status: document.getElementById('statusBox'),
      profile: document.getElementById('profileCard'),
      avatar: document.getElementById('profileAvatar'),
      name: document.getElementById('profileName'),
      login: document.getElementById('profileLogin'),
      bio: document.getElementById('profileBio'),
      meta: document.getElementById('profileMeta'),
      stats: document.getElementById('profileStats'),
      reposSection: document.getElementById('reposSection'),
      reposList: document.getElementById('reposList'),
      themeBtn: document.getElementById('themeToggle')
    };

    const API = 'https://api.github.com';

    function setStatus(html, tone) {
      els.status.className = 'rounded-2xl shadow-sm border p-6 text-center ' +
        (tone === 'error' ? 'bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800 text-red-700 dark:text-red-300'
         : tone === 'loading' ? 'bg-indigo-50 dark:bg-indigo-900/20 border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-300'
         : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300');
      els.status.innerHTML = html;
      els.status.classList.remove('hidden');
    }
    function clearStatus() { els.status.classList.add('hidden'); }

    function badge(text, color) {
      return `<span class="px-2.5 py-1 rounded-full font-semibold ${color}">${text}</span>`;
    }

    function statBox(label, value) {
      return `<div class="bg-slate-50 dark:bg-slate-700 rounded-xl p-3 text-center border border-slate-200 dark:border-slate-600">
        <div class="text-2xl font-black text-indigo-700 dark:text-indigo-400">${value.toLocaleString('en-US')}</div>
        <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${label}</div>
      </div>`;
    }

    function renderProfile(user) {
      els.avatar.src = user.avatar_url;
      els.avatar.alt = user.login;
      els.name.textContent = user.name || user.login;
      els.login.textContent = '@' + user.login;
      els.login.href = user.html_url;
      els.bio.textContent = user.bio || 'لا توجد نبذة متاحة.';
      els.meta.innerHTML = [
        user.location ? badge('📍 ' + user.location, 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300') : '',
        user.company ? badge('🏢 ' + user.company, 'bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400') : '',
        user.blog ? `<a href="${user.blog.startsWith('http') ? user.blog : 'https://' + user.blog}" target="_blank" rel="noopener" class="px-2.5 py-1 rounded-full font-semibold bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-400 hover:underline">🔗 الموقع</a>` : ''
      ].join('');
      els.stats.innerHTML = statBox('متابِعون', user.followers) + statBox('يتابع', user.following) + statBox('مستودعات', user.public_repos);
      els.profile.classList.remove('hidden');
    }

    function renderRepos(repos) {
      if (!repos.length) { els.reposSection.classList.add('hidden'); return; }
      const top = [...repos].sort((a, b) => b.stargazers_count - a.stargazers_count).slice(0, 6);
      els.reposList.innerHTML = top.map(r => `
        <a href="${r.html_url}" target="_blank" rel="noopener" class="block bg-slate-50 dark:bg-slate-700 hover:bg-indigo-50 dark:hover:bg-slate-600 border border-slate-200 dark:border-slate-600 rounded-xl p-4 transition">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span class="font-bold text-slate-800 dark:text-white truncate" dir="ltr">${r.name}</span>
            <span class="text-xs text-amber-600 dark:text-amber-400 font-semibold shrink-0">⭐ ${r.stargazers_count}</span>
          </div>
          <p class="text-xs text-slate-600 dark:text-slate-300 line-clamp-2 leading-relaxed min-h-[2rem]">${(r.description || 'لا يوجد وصف').replace(/</g,'&lt;')}</p>
          <div class="flex items-center gap-2 mt-2 text-[11px] text-slate-500 dark:text-slate-400">
            ${r.language ? `<span class="px-2 py-0.5 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600">${r.language}</span>` : ''}
            <span>🍴 ${r.forks_count}</span>
          </div>
        </a>`).join('');
      els.reposSection.classList.remove('hidden');
    }

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (res.status === 404) throw new Error('NOT_FOUND');
      if (res.status === 403) throw new Error('RATE_LIMIT');
      if (!res.ok) throw new Error('NETWORK');
      return res.json();
    }

    async function search(username) {
      els.profile.classList.add('hidden');
      els.reposSection.classList.add('hidden');
      setStatus('⏳ جارٍ التحميل...', 'loading');
      try {
        const user = await fetchJSON(`${API}/users/${encodeURIComponent(username)}`);
        const repos = await fetchJSON(`${API}/users/${encodeURIComponent(username)}/repos?per_page=100&sort=updated`);
        clearStatus();
        renderProfile(user);
        renderRepos(repos);
        localStorage.setItem('ghlens-last', username);
      } catch (err) {
        const msg = err.message === 'NOT_FOUND' ? '❌ لم يتم العثور على هذا المستخدم.'
          : err.message === 'RATE_LIMIT' ? '⚠️ تم تجاوز حد الطلبات لـ GitHub، حاول لاحقاً.'
          : '⚠️ تعذّر الاتصال بـ GitHub، تحقّق من اتصالك بالإنترنت.';
        setStatus(msg, 'error');
      }
    }

    els.form.addEventListener('submit', e => {
      e.preventDefault();
      const v = els.input.value.trim();
      if (v) search(v);
    });

    els.themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('ghlens-theme', isDark ? 'dark' : 'light');
      els.themeBtn.textContent = isDark ? '☀️ الوضع الفاتح' : '🌙 الوضع الداكن';
    });
    if (document.documentElement.classList.contains('dark')) els.themeBtn.textContent = '☀️ الوضع الفاتح';

    // Auto-load last search or default sample
    const last = localStorage.getItem('ghlens-last') || 'mahmoudmagdyedu';
    els.input.value = last;
    search(last);
  </script>
</body>
</html>
