<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordWise — قاموس إنجليزي تفاعلي</title>
  <meta name="description" content="قاموس إنجليزي تفاعلي مع نطق ومرادفات وأمثلة — مبني بـ JavaScript و Free Dictionary API." />
  <meta name="theme-color" content="#4338ca" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    if (localStorage.getItem('wordwise-theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=Inter:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors">

  <header class="hero text-white">
    <div class="max-w-3xl mx-auto px-4 py-8 sm:py-12">
      <div class="flex items-center justify-between mb-6">
        <a href="/" class="inline-flex items-center gap-2 text-sm font-bold bg-white/10 backdrop-blur px-4 py-2 rounded-full border border-white/20 hover:bg-white/20 transition">← الرئيسية</a>
        <button id="themeBtn" class="inline-flex items-center gap-2 text-sm font-bold bg-white/10 backdrop-blur px-4 py-2 rounded-full border border-white/20 hover:bg-white/20 transition" aria-label="تبديل الوضع">🌙 <span>الوضع الداكن</span></button>
      </div>
      <div class="text-center">
        <div class="text-5xl sm:text-6xl mb-3">📖</div>
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-black tracking-tight mb-2">WordWise</h1>
        <p class="text-indigo-100 text-base sm:text-lg font-semibold">قاموس إنجليزي تفاعلي — معاني، نطق، أمثلة، ومرادفات</p>
      </div>

      <form id="searchForm" class="mt-7 flex flex-col sm:flex-row gap-2 max-w-2xl mx-auto" dir="ltr">
        <input id="searchInput" type="text" placeholder="Type a word… e.g. serendipity" autocomplete="off" required
          class="flex-1 px-5 py-3 rounded-xl text-slate-800 placeholder-slate-400 bg-white/95 focus:bg-white outline-none focus:ring-4 focus:ring-white/30 font-semibold" />
        <button type="submit" class="px-6 py-3 rounded-xl bg-white text-indigo-700 font-bold hover:bg-indigo-50 transition shadow-lg">🔍 Search</button>
      </form>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">

    <!-- History -->
    <section id="historySection" class="hidden bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-5 border border-slate-100 dark:border-slate-700 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-slate-500 dark:text-slate-400">📚 آخر عمليات البحث</h2>
        <button id="clearHistory" class="text-xs font-bold text-red-600 hover:text-red-700 transition">مسح</button>
      </div>
      <div id="historyList" class="flex flex-wrap gap-2" dir="ltr"></div>
    </section>

    <!-- Status / Loading / Error -->
    <div id="status" class="hidden bg-white dark:bg-slate-800 rounded-2xl p-6 text-center border border-slate-100 dark:border-slate-700 shadow-sm"></div>

    <!-- Result -->
    <article id="result" class="hidden bg-white dark:bg-slate-800 rounded-2xl p-5 sm:p-7 border border-slate-100 dark:border-slate-700 shadow-sm space-y-5" dir="ltr"></article>

    <!-- Empty state -->
    <section id="emptyState" class="bg-white dark:bg-slate-800 rounded-2xl p-8 text-center border border-slate-100 dark:border-slate-700 shadow-sm">
      <div class="text-5xl mb-3">🔎</div>
      <h3 class="font-black text-lg mb-1">ابدأ بالبحث عن كلمة</h3>
      <p class="text-slate-500 dark:text-slate-400 text-sm">جرّب كلمات مثل: <span class="sample-word" data-word="serendipity">serendipity</span> · <span class="sample-word" data-word="ephemeral">ephemeral</span> · <span class="sample-word" data-word="resilience">resilience</span></p>
    </section>

  </main>

  <footer class="text-center py-6 text-xs text-slate-500 dark:text-slate-400">
    <p>© 2025 WordWise — جزء من <a href="/" class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline">My-Portfolio</a></p>
    <p class="mt-1">Powered by <a href="https://dictionaryapi.dev/" target="_blank" rel="noopener" class="hover:underline">Free Dictionary API</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
