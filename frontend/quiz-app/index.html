<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App — Test Your Knowledge</title>
  <meta name="description" content="Interactive quiz app with categories, difficulty levels, timer & score tracking. Built with TypeScript & Tailwind CSS." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ['Inter', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); min-height: 100vh; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeIn 0.4s ease both; }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(99,102,241,0.4); } 70% { box-shadow: 0 0 0 12px rgba(99,102,241,0); } 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0); } }
    .pulse-ring { animation: pulse-ring 2s infinite; }
    .timer-ring { transform: rotate(-90deg); transform-origin: center; }
  </style>
</head>
<body class="gradient-bg">
  <div class="max-w-2xl mx-auto px-4 py-8 sm:py-12">

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="animate-in">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-white/20 backdrop-blur mb-4 text-5xl">🧠</div>
        <h1 class="text-4xl sm:text-5xl font-black text-white mb-2 tracking-tight">Quiz App</h1>
        <p class="text-white/70 text-lg">Test your knowledge across dozens of categories</p>
      </div>
      <div class="glass rounded-3xl shadow-2xl p-6 sm:p-8 space-y-6">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">📂 Category</label>
          <select id="category-select" class="w-full bg-white border-2 border-slate-200 rounded-xl px-4 py-3 text-slate-700 font-medium focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition">
            <option value="0">🎲 Loading categories…</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">📊 Difficulty</label>
          <div class="grid grid-cols-3 gap-3">
            <button class="difficulty-btn bg-white text-slate-700 font-bold py-3 rounded-xl border-2 border-slate-200 hover:border-indigo-400 transition" data-diff="easy">😊 Easy</button>
            <button class="difficulty-btn bg-white text-slate-700 font-bold py-3 rounded-xl border-2 border-slate-200 hover:border-indigo-400 transition" data-diff="medium">🤔 Medium</button>
            <button class="difficulty-btn bg-white text-slate-700 font-bold py-3 rounded-xl border-2 border-slate-200 hover:border-indigo-400 transition" data-diff="hard">🔥 Hard</button>
          </div>
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">🔢 Number of Questions</label>
          <input id="amount-input" type="number" min="1" max="50" value="10" class="w-full bg-white border-2 border-slate-200 rounded-xl px-4 py-3 text-slate-700 font-medium focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition" />
        </div>
        <p id="error-msg" class="text-red-500 text-sm font-bold text-center"></p>
        <button id="start-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black text-lg py-4 rounded-xl shadow-lg shadow-indigo-500/30 transition-all hover:shadow-xl hover:shadow-indigo-500/40 active:scale-[0.98]">🚀 Start Quiz</button>
      </div>
    </div>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" class="hidden animate-in">
      <div class="glass rounded-3xl shadow-2xl p-12 text-center">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-indigo-100 mb-6 pulse-ring">
          <svg class="w-10 h-10 text-indigo-600 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
        </div>
        <h2 class="text-2xl font-black text-slate-800 mb-2">Loading Questions…</h2>
        <p class="text-slate-500">Preparing your quiz experience</p>
      </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden animate-in">
      <div class="glass rounded-3xl shadow-2xl overflow-hidden">
        <div class="bg-white/50 px-6 py-4 border-b border-slate-200/50">
          <div class="flex items-center justify-between mb-3">
            <span id="progress-text" class="text-sm font-bold text-slate-600">1 / 10</span>
            <span id="score-text" class="text-sm font-bold text-indigo-600">⭐ 0</span>
          </div>
          <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full transition-all duration-500" style="width:10%"></div>
          </div>
        </div>
        <div class="p-6 sm:p-8">
          <div class="flex justify-center mb-6">
            <div class="relative w-[72px] h-[72px]">
              <svg class="w-full h-full" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="54" fill="none" stroke="#e2e8f0" stroke-width="8" />
                <circle id="timer-circle" class="timer-ring" cx="60" cy="60" r="54" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
              </svg>
              <span id="timer-text" class="absolute inset-0 flex items-center justify-center text-xl font-black text-indigo-700">30</span>
            </div>
          </div>
          <div class="flex flex-wrap gap-2 mb-4">
            <span id="category-badge" class="text-xs font-bold bg-slate-100 text-slate-600 px-3 py-1 rounded-full">Category</span>
            <span id="difficulty-badge" class="text-xs font-bold bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full">Medium</span>
          </div>
          <h2 id="question-text" class="text-xl sm:text-2xl font-black text-slate-800 mb-6 leading-snug">Question goes here</h2>
          <div id="answers-grid" class="space-y-3"></div>
        </div>
      </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="results-screen" class="hidden animate-in">
      <div class="glass rounded-3xl shadow-2xl p-6 sm:p-8">
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-indigo-100 mb-4"><span class="text-5xl">🏆</span></div>
          <p id="final-grade" class="text-2xl font-black text-indigo-600 mb-2">Great Job!</p>
          <div class="flex items-center justify-center gap-3">
            <span class="text-5xl font-black text-slate-800" id="final-score">0</span>
            <span class="text-2xl text-slate-400 font-bold">/</span>
            <span class="text-5xl font-black text-slate-400" id="final-total">0</span>
          </div>
          <p class="text-lg font-bold text-indigo-500 mt-1" id="final-percent">0%</p>
        </div>
        <div class="mb-8">
          <h3 class="text-lg font-black text-slate-700 mb-4">📝 Review Answers</h3>
          <div id="answers-review" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>
        </div>
        <div class="mb-6">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-lg font-black text-slate-700">🏅 High Scores</h3>
            <button id="clear-scores-btn" class="text-xs text-red-400 hover:text-red-600 font-bold transition">Clear All</button>
          </div>
          <div id="high-scores-list" class="bg-slate-50 rounded-xl p-4"></div>
        </div>
        <button id="play-again-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black text-lg py-4 rounded-xl shadow-lg shadow-indigo-500/30 transition-all hover:shadow-xl active:scale-[0.98]">🔄 Play Again</button>
      </div>
    </div>

  </div>
  <script src="dist/app.js"></script>
</body>
</html>
