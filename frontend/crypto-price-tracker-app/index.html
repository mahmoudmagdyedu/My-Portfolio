<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoPulse — متتبّع أسعار العملات الرقمية</title>
  <meta name="description" content="CryptoPulse — تطبيق ويب بسيط لمتابعة أسعار العملات الرقمية لحظيًا باستخدام CoinGecko API" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://api.coingecko.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="hero">
    <div class="container hero-inner">
      <div class="brand">
        <span class="logo">📈</span>
        <div>
          <h1>CryptoPulse</h1>
          <p>متتبّع أسعار العملات الرقمية لحظيًا</p>
        </div>
      </div>
      <div class="hero-actions">
        <select id="vs-currency" aria-label="العملة المرجعية">
          <option value="usd">USD $</option>
          <option value="eur">EUR €</option>
          <option value="egp">EGP £</option>
        </select>
        <button id="refresh-btn" type="button" aria-label="تحديث">🔄 تحديث</button>
        <button id="theme-btn" type="button" aria-label="تبديل الوضع">🌙 الوضع الداكن</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <div class="search">
        <input id="search-input" type="search" placeholder="ابحث باسم أو رمز العملة (BTC, ETH...)" aria-label="بحث" />
      </div>
      <div class="sort">
        <label for="sort-select">فرز:</label>
        <select id="sort-select">
          <option value="market_cap_desc">القيمة السوقية ↓</option>
          <option value="price_desc">السعر ↓</option>
          <option value="price_asc">السعر ↑</option>
          <option value="change_desc">التغيّر 24س ↓</option>
          <option value="change_asc">التغيّر 24س ↑</option>
        </select>
      </div>
      <button id="favorites-only" type="button" aria-pressed="false">⭐ المفضلة فقط</button>
    </section>

    <section class="status" id="status">جاري التحميل…</section>

    <section class="table-wrap">
      <table class="crypto-table" aria-describedby="status">
        <thead>
          <tr>
            <th>#</th>
            <th>العملة</th>
            <th>السعر</th>
            <th>تغيّر 24س</th>
            <th>القيمة السوقية</th>
            <th>مفضلة</th>
          </tr>
        </thead>
        <tbody id="crypto-tbody"></tbody>
      </table>
    </section>

    <p class="footer-note">المصدر: <a href="https://www.coingecko.com" target="_blank" rel="noopener">CoinGecko Public API</a> — التحديث التلقائي كل 60 ثانية.</p>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
