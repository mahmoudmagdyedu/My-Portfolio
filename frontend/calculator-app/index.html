<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CalcPro — آلة حاسبة احترافية</title>
  <meta name="description" content="آلة حاسبة احترافية بوضعَي Standard و Scientific، سجل عمليات، ودعم كامل للوحة المفاتيح ووضع داكن." />
  <meta name="theme-color" content="#312e81" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo" aria-hidden="true">🧮</span>
      <div>
        <h1>CalcPro</h1>
        <p>آلة حاسبة احترافية</p>
      </div>
    </div>
    <div class="actions">
      <button id="mode-toggle" class="chip" type="button" aria-pressed="false">الوضع: Standard</button>
      <button id="theme-toggle" class="chip ghost" type="button" aria-label="تبديل الوضع الداكن">🌙</button>
    </div>
  </header>

  <main class="layout">
    <section class="calc" aria-label="الآلة الحاسبة">
      <div class="display" dir="ltr">
        <div id="expr" class="expr" aria-live="polite"></div>
        <div id="result" class="result" aria-live="polite">0</div>
      </div>

      <div id="keypad" class="keypad standard" role="group" aria-label="أزرار الآلة الحاسبة">
        <!-- Scientific row (يظهر في الوضع العلمي) -->
        <button class="key sci" data-fn="sin">sin</button>
        <button class="key sci" data-fn="cos">cos</button>
        <button class="key sci" data-fn="tan">tan</button>
        <button class="key sci" data-fn="log">log</button>
        <button class="key sci" data-fn="ln">ln</button>
        <button class="key sci" data-fn="sqrt">√</button>
        <button class="key sci" data-fn="sq">x²</button>
        <button class="key sci" data-op="^">x^y</button>
        <button class="key sci" data-const="pi">π</button>
        <button class="key sci" data-const="e">e</button>
        <button class="key sci" data-fn="fact">x!</button>
        <button class="key sci" data-paren="(">(</button>
        <button class="key sci" data-paren=")">)</button>

        <!-- Standard keys -->
        <button class="key util" data-action="clear">C</button>
        <button class="key util" data-action="back">⌫</button>
        <button class="key util" data-op="%">%</button>
        <button class="key op" data-op="/">÷</button>

        <button class="key num" data-num="7">7</button>
        <button class="key num" data-num="8">8</button>
        <button class="key num" data-num="9">9</button>
        <button class="key op" data-op="*">×</button>

        <button class="key num" data-num="4">4</button>
        <button class="key num" data-num="5">5</button>
        <button class="key num" data-num="6">6</button>
        <button class="key op" data-op="-">−</button>

        <button class="key num" data-num="1">1</button>
        <button class="key num" data-num="2">2</button>
        <button class="key num" data-num="3">3</button>
        <button class="key op" data-op="+">+</button>

        <button class="key num" data-action="sign">±</button>
        <button class="key num" data-num="0">0</button>
        <button class="key num" data-num=".">.</button>
        <button class="key eq" data-action="equals">=</button>
      </div>
    </section>

    <aside class="history" aria-label="سجل العمليات">
      <div class="history-head">
        <h2>السجل</h2>
        <button id="clear-history" class="chip ghost small" type="button">مسح</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
      <p id="history-empty" class="empty">لا توجد عمليات بعد. ابدأ الحساب!</p>
    </aside>
  </main>

  <footer class="foot">
    <p>صُنع بحب ❤️ — جزء من <a href="/" rel="noopener">My-Portfolio</a></p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
